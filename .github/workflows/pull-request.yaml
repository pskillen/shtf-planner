name: Pull request

on:
  pull_request:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Test report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Vitest
          path: test-results/junit.xml
          reporter: java-junit
          list-suites: all
          list-tests: all
          report-title: Test results

      - name: Bake the changelog from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/releases.mjs

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bake the changelog from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/releases.mjs

      - name: Build SPA
        env:
          # A fake id: the e2e tests replace Google Identity Services and the Drive API.
          VITE_GOOGLE_CLIENT_ID: e2e-fake-client.apps.googleusercontent.com
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  preview:
    needs: [check, e2e]
    uses: ./.github/workflows/cloudflare-pages.yaml
    secrets: inherit
    with:
      build_env: preview
      cloudflare_branch: ${{ github.head_ref }}
